services:
  db:
    image: postgres:16-alpine
    container_name: gitdash-db
    environment:
      POSTGRES_USER: gitdash
      POSTGRES_PASSWORD: gitdash
      POSTGRES_DB: gitdash
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitdash -d gitdash"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gitdash-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://gitdash:gitdash@db:5432/gitdash
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: gitdash-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
